<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecomerse store site</title>
    <link rel="stylesheet" href="ecomerce.css">
</head>
<body>
    <h2>Ecomerce site</h2>
    <div id="store">
        <div class="product" id="list"></div>
        <div class="cart">
            <h3>Shopping cart</h3>
            <ul id="cart-items"></ul>
            <p><strong>total:</strong> $<span id="total-price">0.00</span></p>
            <button id="clear-cart">Clear cart</button>
        </div>
    </div>
    <script src="ecomerce.js"></script>
</body>
</html>
